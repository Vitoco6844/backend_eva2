{% extends 'manage/base.html' %}{% load static %}
{# El evento seleccionado se compara con el UUID para evitar ingresos equivocados. #}
{% block management %}<p class="eyebrow">OPERACION</p><h1>Control de acceso</h1><div id="page-error" class="notice error" role="alert" hidden></div><form id="admission-form" class="management-form narrow"><label>Evento<select name="event" required><option value="">Seleccionar evento</option>{% for event in events %}<option value="{{ event.id }}">{{ event.name }} · {{ event.starts_at|date:'d M Y' }}</option>{% endfor %}</select></label><label>Codigo de entrada<input name="ticket" required placeholder="UUID de la entrada" autocomplete="off" spellcheck="false"></label><button class="button" type="submit"><i data-lucide="scan-line"></i>Validar ingreso</button></form><div id="admission-result" class="notice success" role="status" hidden></div>{% endblock %}
{% block scripts %}<script src="{% static 'js/admission.js' %}" defer></script>{% endblock %}
