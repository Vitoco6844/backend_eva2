{% extends 'manage/base.html' %}{% load static %}
{% block management %}
<!-- Consulta de ventas; las acciones se realizan en el detalle de cada compra. -->
<p class="eyebrow">OPERACION</p><h1>Ventas</h1>
<div id="page-error" class="notice error" role="alert" hidden></div>
<form id="sales-filters" class="list-toolbar">
  <label class="search-field"><span class="sr-only">Cliente o evento</span><i data-lucide="search"></i><input name="q" placeholder="Cliente o evento" type="search"></label>
  <label>Estado<select name="status"><option value="">Todos</option><option value="PENDIENTE">Pendiente</option><option value="PAGADO">Pagado</option><option value="ENTREGADO">Entregado</option><option value="CANCELADO">Cancelado</option></select></label>
  <button class="button" type="submit"><i data-lucide="search"></i>Buscar</button>
</form>
<div id="sales-table" class="table-wrap"></div><div id="pagination" class="pagination"></div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/sales.js' %}" defer></script>{% endblock %}
