{% extends 'base.html' %}{% load static %}
{% block content %}
<!-- Cartelera publica con filtros y tarjetas completadas por la API. -->
<section class="catalog-intro container"><div><p class="eyebrow">EN VIVO. CONTIGO.</p><h1>Tu proximo concierto.</h1><p class="lead">Encuentra el evento. Elige tu lugar. Siente el pulso.</p></div><span class="intro-mark" aria-hidden="true"><i data-lucide="audio-lines"></i></span></section>
<section class="container catalog-section" aria-label="Cartelera">
  <form id="filters" class="filters">
    <label class="search-field"><span class="sr-only">Buscar evento o artista</span><i data-lucide="search"></i><input name="q" placeholder="Evento, artista o recinto" type="search" maxlength="160"></label>
    <label><span>Ciudad</span><select name="ciudad"><option value="">Todas</option>{% for city in cities %}<option>{{ city }}</option>{% endfor %}</select></label>
    <label><span>Desde</span><input type="date" name="fecha_desde"></label>
    <button class="button" type="submit"><i data-lucide="search"></i>Buscar</button>
    <details class="more-filters"><summary>Mas filtros</summary><div class="filter-extra"><label>Hasta<input type="date" name="fecha_hasta"></label><label>Precio minimo<input type="number" min="0" step="1" name="precio_min" placeholder="CLP"></label><label>Precio maximo<input type="number" min="0" step="1" name="precio_max" placeholder="CLP"></label><label class="check"><input type="checkbox" name="disponibles" value="true">Solo disponibles</label><button type="reset" class="text-button">Limpiar filtros</button></div></details>
  </form>
  <div class="section-heading"><h2>En cartelera</h2><p id="result-count" aria-live="polite"></p></div>
  <div id="page-error" class="notice error" role="alert" hidden></div>
  <div id="events-grid" class="event-grid" aria-live="polite"><p class="loading">Cargando eventos...</p></div>
  <div id="pagination" class="pagination"></div>
</section>
<template id="event-card-template"><article class="event-card"><a class="event-image-link"><img class="event-image" alt="" loading="lazy"><span class="event-city"></span></a><div class="event-card-content"><p class="event-date"></p><h3><a class="event-title"></a></h3><p class="event-venue"></p><div class="event-bottom"><span class="event-price"></span><a class="event-link">Ver entradas<i data-lucide="arrow-up-right"></i></a></div></div></article></template>
{% endblock %}
{% block scripts %}<script src="{% static 'js/catalog.js' %}" defer></script>{% endblock %}
